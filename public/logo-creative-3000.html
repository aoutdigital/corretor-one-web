<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Creative 3000</title>
  <style>
    @font-face {
      font-family: "DunbarTallBook";
      src: url("./fonts/DunbarTall-Book.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --canvas-w: 3000px;
      --canvas-h: 1194px; /* 3000 * 70.84 / 178 */

      --bg: #e7e7e7;
      --nick-color: #908b76;
      --logo-primary: #1d1d1b;
      --logo-accent: #908b76;
      --logo-stroke: #1d1d1b;

      --logo-w: 2100px;
      --logo-left: 260px;
      --logo-top: 150px;

      --nick-size: 86px;
      --nick-left: 1720px;
      --nick-top: 910px;
      --nick-letter-spacing: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: var(--canvas-w);
      height: var(--canvas-h);
      aspect-ratio: 178 / 70.84;
      background: var(--bg);
      font-synthesis: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body[data-theme="white"] {
      --logo-primary: #ffffff;
      --logo-accent: #ffffff;
      --logo-stroke: #ffffff;
      --nick-color: #ffffff;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 178 / 70.84;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      color: #1d1d1b;
      text-decoration: none;
      width: 100%;
      padding: 0;
    }

    .logo .logo-mark {
      height: auto;
      width: 100%;
      aspect-ratio: 25 / 7;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .logo .logo-mark .cls-1 {
      fill: var(--logo-primary);
    }

    .logo .logo-mark .cls-2 {
      fill: var(--logo-accent);
    }

    .logo .logo-mark .cls-3 {
      stroke: var(--logo-stroke);
      fill: none;
      stroke-miterlimit: 10;
      stroke-width: 2px;
    }

    .logo span {
      margin: 0;
      margin-top: 0;
      display: block;
      color: var(--nick-color);
      font-family: "DunbarTallBook", sans-serif;
      font-size: 270px;
      line-height: 306px;
      height: 306px;
      padding: 0;
      white-space: nowrap;
    }
  </style>
</head>

      </svg>
      <span data-role="nickname">/nickname</span>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const theme = params.get("theme");
    if (theme === "white" || theme === "light") {
      document.body.dataset.theme = theme;
    }

    const nicknameRaw = (params.get("nickname") || "").trim().toLowerCase();
    const nickname = nicknameRaw.replace(/[^a-z0-9]/g, "");
    if (nickname.length > 0 && nickname.length <= 35) {
      const nicknameNode = document.querySelector('[data-role="nickname"]');
      if (nicknameNode) {
        nicknameNode.textContent = `/${nickname}`;
      }
    }
  </script>

</html>
