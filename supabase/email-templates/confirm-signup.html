<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirme seu cadastro</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7f9;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
            <tr>
              <td align="center" style="padding:24px 24px 8px 24px;">
                <img src="{{ .SiteURL }}/images/logo_email.png" alt="corretor.one" width="180" style="display:block;width:180px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:24px 24px 8px 24px;">
                <h1 style="margin:0;font-size:24px;line-height:1.3;color:#000000;">Confirme sua conta no corretor.one</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 0 24px;font-size:16px;line-height:1.6;color:#59656f;">
                Olá, {{ .Email }}.
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 0 24px;font-size:16px;line-height:1.6;color:#59656f;">
                Clique no botão abaixo para confirmar seu cadastro e continuar seu onboarding.
              </td>
            </tr>
            <tr>
              <td style="padding:24px;" align="left">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e5232b;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px;">
                  Confirmar cadastro
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px 24px;font-size:13px;line-height:1.6;color:#6b7280;">
                Se você não solicitou este cadastro, ignore este e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
